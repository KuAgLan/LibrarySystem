server:
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: library-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/library_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: library_app
    password: library_app_2024
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  lock:
    provider: ${LOCK_PROVIDER:mysql}
    ttl-seconds: 60
  job:
    nightly-cron: ${NIGHTLY_CRON:0 0 2 * * ?}
  jwt:
    secret: ${JWT_SECRET:library-system-dev-secret-key-change-me-2024}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  rules:
    # 默认规则，可在“系统设置”中按读者类型覆盖
    loan-days-student: 30
    loan-days-teacher: 60
    loan-days-public: 15
    max-borrow-student: 5
    max-borrow-teacher: 10
    max-borrow-public: 3
    renew-limit: 1
    renew-days: 15
    fine-per-day: 0.50
    max-fine: 50.00
    block-fine: 10.00
  seed:
    demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    root: INFO
    com.library: INFO
